<!DOCTYPE html>
<html lang="en">
<head>
	<title>Harmony Bangkok - Error</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="expires" content="-1" />
	<style type="text/css">
		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			width: 100%;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			color: #333;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			background: linear-gradient(135deg, #fff5ef 0%, #fdece0 50%, #eaf7ec 100%);
		}

		.card {
			width: 100%;
			max-width: 380px;
			background: #ffffff;
			border: 1px solid rgba(217, 70, 42, 0.12);
			border-radius: 16px;
			box-shadow: 0 18px 48px rgba(217, 70, 42, 0.18), 0 4px 14px rgba(45, 171, 79, 0.10);
			padding: 14px 24px 18px;
			text-align: center;
		}

		.logo {
			width: 100%;
			max-width: 200px;
			height: auto;
			margin: 0 auto 6px;
			display: block;
		}

		.icon {
			width: 48px;
			height: 48px;
			margin: 0 auto 8px;
			border-radius: 50%;
			background: #d9462a;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 4px 14px rgba(217, 70, 42, 0.35);
			color: #fff;
			font-size: 26px;
			font-weight: 700;
			line-height: 48px;
		}

		.title {
			font-size: 17px;
			font-weight: 600;
			color: #d9462a;
			margin-bottom: 2px;
		}

		.subtitle {
			font-size: 13px;
			color: #777;
			margin-bottom: 10px;
		}

		.error {
			margin: 0 0 16px;
			padding: 9px 12px;
			background: #fdecea;
			border: 1px solid #f5c6c0;
			border-radius: 8px;
			color: #c0392b;
			font-size: 12px;
			word-break: break-word;
		}

		.css_button {
			display: inline-block;
			width: 100%;
			padding: 11px;
			font-size: 15px;
			font-weight: 600;
			color: #ffffff;
			border: none;
			border-radius: 9px;
			cursor: pointer;
			text-decoration: none;
			background: linear-gradient(135deg, #e85a37 0%, #d9462a 100%);
			box-shadow: 0 4px 12px rgba(217, 70, 42, 0.30);
			-webkit-appearance: none;
			appearance: none;
		}

		.css_button:hover {
			background: linear-gradient(135deg, #d9462a 0%, #b93a22 100%);
			box-shadow: 0 6px 16px rgba(217, 70, 42, 0.40);
		}

		.hidden { display: none; }

		.footer {
			margin-top: 12px;
			font-size: 11px;
			color: #999;
		}

		.footer .accent { color: #2dab4f; font-weight: 600; }

		@media (max-width: 380px) {
			.card { padding: 12px 18px 16px; border-radius: 14px; }
			.logo { max-width: 180px; margin-bottom: 4px; }
			.title { font-size: 16px; }
		}

		@media (min-height: 700px) and (min-width: 768px) {
			.card { max-width: 400px; padding: 16px 28px 22px; }
			.logo { max-width: 220px; margin-bottom: 8px; }
		}
	</style>
</head>
<body>
	<div class="card">
		<img class="logo" src="img/logo.jpg" alt="Harmony Bangkok" />
		<div class="icon">!</div>
		<div class="title">Something went wrong</div>
		<div class="subtitle">We could not complete your request.</div>
		<div class="error" id="errMsg">Please try again.</div>
		<div class="hidden" id="errSrc">$(error)</div>
		<a class="css_button" href="$(link-login)">Back to login</a>
		<div class="footer">Powered by <span class="accent">Harmony Bangkok</span></div>
	</div>

	<script type="text/javascript">
		(function () {
			var src = document.getElementById('errSrc');
			var msg = document.getElementById('errMsg');
			if (!src || !msg) return;
			var txt = (src.textContent || src.innerText || '').replace(/^\s+|\s+$/g, '');
			if (txt && txt.indexOf('$(') === -1) msg.textContent = txt;
		})();
	</script>
</body>
</html>
