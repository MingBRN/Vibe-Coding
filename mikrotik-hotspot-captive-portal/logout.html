<!DOCTYPE html>
<html lang="en">
<head>
	<title>Harmony Bangkok - Logged Out</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="expires" content="-1" />
	<style type="text/css">
		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			width: 100%;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			color: #333;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			background: linear-gradient(135deg, #fff5ef 0%, #fdece0 50%, #eaf7ec 100%);
		}

		.card {
			width: 100%;
			max-width: 380px;
			background: #ffffff;
			border: 1px solid rgba(217, 70, 42, 0.12);
			border-radius: 16px;
			box-shadow: 0 18px 48px rgba(217, 70, 42, 0.18), 0 4px 14px rgba(45, 171, 79, 0.10);
			padding: 14px 24px 18px;
			text-align: center;
		}

		.logo {
			width: 100%;
			max-width: 200px;
			height: auto;
			margin: 0 auto 6px;
			display: block;
		}

		.title {
			font-size: 17px;
			font-weight: 600;
			color: #d9462a;
			margin-bottom: 2px;
		}

		.subtitle {
			font-size: 13px;
			color: #777;
			margin-bottom: 14px;
		}

		.css_button {
			display: inline-block;
			width: 100%;
			padding: 11px;
			font-size: 15px;
			font-weight: 600;
			color: #ffffff;
			border: none;
			border-radius: 9px;
			cursor: pointer;
			text-decoration: none;
			background: linear-gradient(135deg, #2dab4f 0%, #229140 100%);
			box-shadow: 0 4px 12px rgba(45, 171, 79, 0.30);
			-webkit-appearance: none;
			appearance: none;
		}

		.css_button:hover {
			background: linear-gradient(135deg, #229140 0%, #1a7a34 100%);
			box-shadow: 0 6px 16px rgba(45, 171, 79, 0.40);
		}

		.footer {
			margin-top: 12px;
			font-size: 11px;
			color: #999;
		}

		.footer .accent { color: #2dab4f; font-weight: 600; }

		@media (max-width: 380px) {
			.card { padding: 12px 18px 16px; border-radius: 14px; }
			.logo { max-width: 180px; margin-bottom: 4px; }
			.title { font-size: 16px; }
		}

		@media (min-height: 700px) and (min-width: 768px) {
			.card { max-width: 400px; padding: 16px 28px 22px; }
			.logo { max-width: 220px; margin-bottom: 8px; }
		}
	</style>
</head>
<body>
	<div class="card">
		<img class="logo" src="img/logo.jpg" alt="Harmony Bangkok" />
		<div class="title">Logged out</div>
		<div class="subtitle">You have been disconnected from the WiFi.</div>
		<a class="css_button" href="$(link-login)">Log in again</a>
		<div class="footer">Powered by <span class="accent">Harmony Bangkok</span></div>
	</div>
</body>
</html>
