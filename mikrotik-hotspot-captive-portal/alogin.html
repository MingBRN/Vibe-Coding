<!DOCTYPE html>
<html lang="en">
<head>
	<title>Harmony Bangkok - Connecting</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta http-equiv="refresh" content="1; url=welcome.html" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="expires" content="-1" />
	<style type="text/css">
		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			width: 100%;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			color: #333;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			background: linear-gradient(135deg, #fff5ef 0%, #fdece0 50%, #eaf7ec 100%);
		}

		.card {
			width: 100%;
			max-width: 440px;
			background: #ffffff;
			border: 1px solid rgba(217, 70, 42, 0.12);
			border-radius: 18px;
			box-shadow: 0 22px 56px rgba(217, 70, 42, 0.18), 0 4px 16px rgba(45, 171, 79, 0.10);
			padding: 26px 32px 32px;
			text-align: center;
		}

		.logo {
			width: 100%;
			max-width: 220px;
			height: auto;
			margin: 0 auto 22px;
			display: block;
		}

		.spinner {
			width: 88px;
			height: 88px;
			margin: 0 auto 22px;
			border: 6px solid #f0f0f0;
			border-top-color: #d9462a;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin { to { transform: rotate(360deg); } }

		.title {
			font-size: 20px;
			font-weight: 700;
			color: #d9462a;
			margin-bottom: 6px;
			line-height: 1.2;
		}

		.subtitle {
			font-size: 14px;
			color: #777;
			line-height: 1.55;
		}

		@media (max-width: 380px) {
			.card { padding: 20px 22px 24px; border-radius: 14px; }
			.logo { max-width: 190px; margin-bottom: 18px; }
			.spinner { width: 76px; height: 76px; margin-bottom: 18px; }
			.title { font-size: 18px; }
			.subtitle { font-size: 13px; }
		}

		@media (min-height: 700px) and (min-width: 768px) {
			.card { max-width: 480px; padding: 32px 38px 36px; }
			.logo { max-width: 240px; margin-bottom: 26px; }
			.spinner { width: 96px; height: 96px; margin-bottom: 26px; }
			.title { font-size: 22px; }
		}
	</style>
	<script type="text/javascript">
		function startClock() {
			setTimeout(function () {
				var dest = 'welcome.html';
				var orig = '$(link-redirect)';
				var unsub = '$' + '(link-redirect)';
				if (orig && orig !== unsub && /^https?:\/\//i.test(orig)) {
					dest = 'welcome.html?next=' + encodeURIComponent(orig);
				}
				location.href = dest;
			}, 800);
		}
	</script>
</head>
<body onload="startClock()">
	<div class="card">
		<img class="logo" src="img/logo.jpg" alt="Harmony Bangkok" />
		<div class="spinner"></div>
		<div class="title">Signing you in</div>
		<div class="subtitle">Please wait a moment...</div>
	</div>
</body>
</html>
