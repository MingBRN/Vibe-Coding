<!DOCTYPE html>
<html lang="en">
<head>
	<title>Welcome to Harmony Bangkok</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="expires" content="-1" />
	<style type="text/css">
		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			width: 100%;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			color: #333;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			background: linear-gradient(135deg, #fff5ef 0%, #fdece0 50%, #eaf7ec 100%);
		}

		.card {
			width: 100%;
			max-width: 440px;
			background: #ffffff;
			border: 1px solid rgba(217, 70, 42, 0.12);
			border-radius: 18px;
			box-shadow: 0 22px 56px rgba(217, 70, 42, 0.18), 0 4px 16px rgba(45, 171, 79, 0.10);
			padding: 28px 32px 28px;
			text-align: center;
		}

		.logo {
			width: 100%;
			max-width: 220px;
			height: auto;
			margin: 0 auto 28px;
			display: block;
		}

		.check {
			width: 110px;
			height: 110px;
			margin: 0 auto 24px;
			display: flex;
			align-items: center;
			justify-content: center;
			animation: pop 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
		}

		.check svg {
			width: 100%;
			height: 100%;
			fill: none;
			stroke: #14a83a;
			stroke-width: 9;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		@keyframes pop {
			0%   { transform: scale(0.4); opacity: 0; }
			60%  { transform: scale(1.08); opacity: 1; }
			100% { transform: scale(1); opacity: 1; }
		}

		.title {
			font-size: 22px;
			font-weight: 700;
			color: #d9462a;
			margin-bottom: 10px;
			line-height: 1.25;
			letter-spacing: -0.2px;
		}

		.subtitle {
			font-size: 14px;
			color: #777;
			line-height: 1.6;
			margin-bottom: 26px;
			max-width: 320px;
			margin-left: auto;
			margin-right: auto;
		}

		.css_button {
			display: inline-block;
			width: 100%;
			padding: 13px;
			font-size: 15px;
			font-weight: 600;
			color: #ffffff;
			border: none;
			border-radius: 10px;
			cursor: pointer;
			text-decoration: none;
			background: linear-gradient(135deg, #e85a37 0%, #d9462a 100%);
			box-shadow: 0 5px 14px rgba(217, 70, 42, 0.30);
			transition: background 0.2s, box-shadow 0.2s;
			-webkit-appearance: none;
			appearance: none;
		}

		.css_button:hover {
			background: linear-gradient(135deg, #d9462a 0%, #b93a22 100%);
			box-shadow: 0 7px 18px rgba(217, 70, 42, 0.40);
		}

		.footer {
			margin-top: 22px;
			font-size: 12px;
			color: #999;
		}

		.footer .accent { color: #2dab4f; font-weight: 600; }

		@media (max-width: 380px) {
			.card { padding: 22px 22px 24px; border-radius: 14px; }
			.logo { max-width: 190px; margin-bottom: 22px; }
			.check { width: 92px; height: 92px; margin-bottom: 20px; }
			.title { font-size: 19px; margin-bottom: 8px; }
			.subtitle { font-size: 13px; margin-bottom: 22px; }
			.footer { margin-top: 18px; }
		}

		@media (min-height: 700px) and (min-width: 768px) {
			.card { max-width: 480px; padding: 36px 38px 32px; }
			.logo { max-width: 240px; margin-bottom: 32px; }
			.check { width: 120px; height: 120px; margin-bottom: 28px; }
			.title { font-size: 24px; margin-bottom: 12px; }
			.subtitle { font-size: 15px; margin-bottom: 30px; }
		}
	</style>
</head>
<body>
	<div class="card">
		<img class="logo" src="img/logo.jpg" alt="Harmony Bangkok" />

		<div class="check">
			<svg viewBox="0 0 100 100">
				<circle cx="50" cy="50" r="42" />
				<polyline points="30,52 44,67 72,37" />
			</svg>
		</div>

		<div class="title">Welcome to Harmony Bangkok</div>
		<div class="subtitle">Your WiFi is ready. Enjoy a smooth and secure connection during your stay.</div>

		<a class="css_button" id="continueBtn" href="https://www.google.com/" rel="noopener noreferrer" referrerpolicy="no-referrer">Continue to the internet</a>

		<div class="footer">Powered by <span class="accent">Harmony Bangkok</span></div>
	</div>

	<script type="text/javascript">
		(function () {
			function getParam(name) {
				var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
				return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
			}
			var next = getParam('next');
			// only accept http(s) URLs — blocks javascript:, data:, etc.
			if (next && /^https?:\/\//i.test(next)) {
				var btn = document.getElementById('continueBtn');
				if (btn) btn.href = next;
			}
		})();
	</script>
</body>
</html>
