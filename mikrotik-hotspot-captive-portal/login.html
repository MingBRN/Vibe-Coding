<!DOCTYPE html>
<html lang="en">
<head>
	<title>Harmony Bangkok - WiFi Login</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="expires" content="-1" />
	<style type="text/css">
		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			width: 100%;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			color: #333;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			background: linear-gradient(135deg, #fff5ef 0%, #fdece0 50%, #eaf7ec 100%);
		}

		.card {
			width: 100%;
			max-width: 380px;
			background: #ffffff;
			border: 1px solid rgba(217, 70, 42, 0.12);
			border-radius: 16px;
			box-shadow: 0 18px 48px rgba(217, 70, 42, 0.18), 0 4px 14px rgba(45, 171, 79, 0.10);
			padding: 14px 24px 18px;
			text-align: center;
		}

		.logo {
			width: 100%;
			max-width: 200px;
			height: auto;
			margin: 0 auto 6px;
			display: block;
		}

		.welcome {
			font-size: 17px;
			font-weight: 600;
			color: #d9462a;
			margin-bottom: 1px;
		}

		.subtitle {
			font-size: 12px;
			color: #777;
			margin-bottom: 12px;
		}

		form { width: 100%; }

		.field {
			position: relative;
			margin-bottom: 10px;
		}

		.inputs {
			width: 100%;
			padding: 11px 14px;
			font-size: 14px;
			color: #333;
			background: #f7f7f7;
			border: 1px solid #ececec;
			border-radius: 9px;
			transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
			-webkit-appearance: none;
			appearance: none;
		}

		.inputs::placeholder { color: #aaa; }

		.inputs:focus {
			outline: none;
			background: #ffffff;
			border-color: #d9462a;
			box-shadow: 0 0 0 3px rgba(217, 70, 42, 0.12);
		}

		.css_button {
			width: 100%;
			padding: 11px;
			margin-top: 6px;
			font-size: 15px;
			font-weight: 600;
			color: #ffffff;
			border: none;
			border-radius: 9px;
			cursor: pointer;
			background: linear-gradient(135deg, #e85a37 0%, #d9462a 100%);
			box-shadow: 0 4px 12px rgba(217, 70, 42, 0.30);
			transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
			-webkit-appearance: none;
			appearance: none;
		}

		.css_button:hover {
			background: linear-gradient(135deg, #d9462a 0%, #b93a22 100%);
			box-shadow: 0 6px 16px rgba(217, 70, 42, 0.40);
		}

		.css_button:active { transform: translateY(1px); }

		.error {
			display: none;
			margin-top: 12px;
			padding: 9px 12px;
			background: #fdecea;
			border: 1px solid #f5c6c0;
			border-radius: 8px;
			color: #c0392b;
			font-size: 12px;
		}

		.error.show { display: block; }
		.hidden { display: none; }

		.footer {
			margin-top: 10px;
			font-size: 11px;
			color: #999;
		}

		.footer .accent { color: #2dab4f; font-weight: 600; }

		@media (max-width: 380px) {
			.card { padding: 12px 18px 16px; border-radius: 14px; }
			.logo { max-width: 180px; margin-bottom: 4px; }
			.welcome { font-size: 16px; }
		}

		@media (min-height: 700px) and (min-width: 768px) {
			.card { max-width: 400px; padding: 16px 28px 22px; }
			.logo { max-width: 220px; margin-bottom: 8px; }
		}
	</style>
</head>
<body>

	<div class="hidden">
		$(if chap-id)
		<form name="sendin" action="$(link-login-only)" method="post">
			<input type="hidden" name="username" />
			<input type="hidden" name="password" />
			<input type="hidden" name="dst" value="$(link-orig)" />
			<input type="hidden" name="popup" value="false" />
		</form>
		$(endif)
	</div>

	<script type="text/javascript" src="/md5.js"></script>
	<script type="text/javascript">
		function doLogin() {
			document.sendin.username.value = document.login.username.value;
			document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
			document.sendin.submit();
			return false;
		}
	</script>

	<div class="card">
		<img class="logo" src="img/logo.jpg" alt="Harmony Bangkok" />
		<div class="welcome">Welcome</div>
		<div class="subtitle">Sign in to access the WiFi</div>

		<form name="login" action="$(link-login-only)" method="post" $(if chap-id) onsubmit="return doLogin()" $(endif)>
			<input type="hidden" name="dst" value="$(link-orig)" />
			<input type="hidden" name="popup" value="false" />

			<div class="field">
				<input type="text" name="username" class="inputs" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" />
			</div>
			<div class="field">
				<input type="password" name="password" class="inputs" placeholder="Password" autocomplete="current-password" />
			</div>

			<input type="submit" class="css_button" value="Login" />
		</form>

		<div class="error" id="errMsg"></div>
		<div class="hidden" id="errSrc">$(if error)$(error)$(endif)</div>

		<div class="footer">
			Powered by <span class="accent">Harmony Bangkok</span>
		</div>
	</div>

	<script type="text/javascript">
		(function () {
			var u = document.login && document.login.username;
			if (u) {
				var raw = '$(username)';
				var unsub = '$' + '(username)';
				if (raw && raw !== unsub) u.value = raw;
				u.focus();
			}
			var src = document.getElementById('errSrc');
			var msg = document.getElementById('errMsg');
			if (src && msg) {
				var txt = (src.textContent || src.innerText || '').replace(/^\s+|\s+$/g, '');
				if (txt && txt.indexOf('$(') === -1) {
					msg.textContent = txt;
					msg.className = 'error show';
				}
			}
		})();
	</script>

</body>
</html>
